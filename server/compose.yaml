services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expensebot}
      POSTGRES_DB: ${POSTGRES_DB:-expensebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Заповніть POSTGRES_PASSWORD у .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:

